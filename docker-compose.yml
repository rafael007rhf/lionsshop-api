services:
  mongo:
    image: mongo:7
    container_name: lionsshop-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          if (!db.hello().isWritablePrimary) {
            try { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}); } catch (error) {
              if (error.codeName !== "AlreadyInitialized") throw error;
            }
            quit(1);
          }
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  mongo-data:
